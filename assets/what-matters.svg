<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">What matters on iPhone Duo</title>
  <desc id="description">Three device poses: closed with a compact outer view, partially folded with a central division, and open with room for two content regions. The layout depends on current available space and system regions, while user state persists across transitions.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171f2c"/><stop offset="1" stop-color="#0e1520"/></linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d7a90"/><stop offset="1" stop-color="#273342"/></linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .heading{fill:#f6f8fc;font-size:23px;font-weight:700}
      .body{fill:#b8c4d4;font-size:16px}
      .label{fill:#86dfcb;font-size:14px;font-weight:700;letter-spacing:1.5px}
      .small{fill:#aab9ca;font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="570" rx="24" fill="url(#surface)"/>
  <text x="48" y="58" fill="#f6f8fc" font-size="31" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="750">What actually matters on this device</text>
  <text x="48" y="88" class="body">The app responds to the space it has now, then carries the same task across every pose.</text>
  <g transform="translate(48 123)">
    <rect width="347" height="313" rx="18" fill="#1c2939" stroke="#35465c"/>
    <text x="23" y="35" class="label">CLOSED</text>
    <text x="23" y="66" class="heading">Compact outer view</text>
    <rect x="116" y="87" width="116" height="139" rx="19" fill="url(#device)"/>
    <rect x="124" y="95" width="100" height="123" rx="13" fill="#d8e2e5"/>
    <rect x="134" y="107" width="69" height="39" rx="6" fill="#8ea7af"/>
    <rect x="134" y="154" width="58" height="9" rx="4" fill="#8ea7af"/>
    <rect x="134" y="171" width="75" height="9" rx="4" fill="#b0c2c8"/>
    <rect x="134" y="188" width="45" height="9" rx="4" fill="#b0c2c8"/>
    <text x="23" y="259" class="small">Fit the current container.</text>
    <text x="23" y="286" class="small">Keep actions within safe areas.</text>
  </g>
  <g transform="translate(427 123)">
    <rect width="347" height="313" rx="18" fill="#1c2939" stroke="#35465c"/>
    <text x="23" y="35" class="label">PARTIALLY FOLDED</text>
    <text x="23" y="66" class="heading">Division at the hinge</text>
    <path d="M65 99 Q174 84 174 104 L174 220 Q125 218 65 211 Z" fill="url(#device)"/>
    <path d="M174 104 Q174 84 282 99 L282 211 Q221 218 174 220 Z" fill="url(#device)"/>
    <path d="M74 104 Q170 93 170 111 L170 211 Q128 207 74 204 Z" fill="#d8e2e5"/>
    <path d="M178 111 Q178 93 273 104 L273 204 Q220 207 178 211 Z" fill="#d8e2e5"/>
    <path d="M174 105 L174 221" stroke="#86dfcb" stroke-width="5" stroke-dasharray="7 7"/>
    <rect x="91" y="126" width="63" height="41" rx="6" fill="#8ea7af"/>
    <rect x="194" y="126" width="61" height="41" rx="6" fill="#8ea7af"/>
    <text x="23" y="259" class="small">Query division and occlusion regions.</text>
    <text x="23" y="286" class="small">Keep touch targets clear of the fold.</text>
  </g>
  <g transform="translate(806 123)">
    <rect width="347" height="313" rx="18" fill="#1c2939" stroke="#35465c"/>
    <text x="23" y="35" class="label">OPEN</text>
    <text x="23" y="66" class="heading">Room for two regions</text>
    <rect x="41" y="95" width="265" height="130" rx="19" fill="url(#device)"/>
    <rect x="49" y="103" width="249" height="114" rx="12" fill="#d8e2e5"/>
    <rect x="61" y="114" width="143" height="90" rx="6" fill="#8ea7af"/>
    <rect x="214" y="114" width="73" height="25" rx="5" fill="#b0c2c8"/>
    <rect x="214" y="148" width="73" height="25" rx="5" fill="#b0c2c8"/>
    <rect x="214" y="182" width="73" height="22" rx="5" fill="#b0c2c8"/>
    <text x="23" y="259" class="small">Show more when space permits.</text>
    <text x="23" y="286" class="small">Preserve hierarchy and selection.</text>
  </g>
  <path d="M196 471 H1000" stroke="#3c5368" stroke-width="2"/>
  <circle cx="196" cy="471" r="6" fill="#86dfcb"/><circle cx="600" cy="471" r="6" fill="#86dfcb"/><circle cx="1000" cy="471" r="6" fill="#86dfcb"/>
  <text x="48" y="512" fill="#f6f8fc" font-size="19" font-weight="700">Pose changes available space</text>
  <text x="48" y="541" class="body">Use the current view or scene size, size class, safe areas, and verified reserved-region APIs.</text>
  <text x="806" y="512" fill="#86dfcb" font-size="18" font-weight="700">User state persists</text>
  <text x="806" y="541" class="body">Drafts · selection · playback</text>
</svg>
